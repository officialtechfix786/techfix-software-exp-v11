<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Database & Search | TechFix Software EXP</title>
<meta name="description" content="Search the full TechFix mobile database by brand, model, model number or chipset.">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/style.css">
<meta property="og:title" content="TechFix Software EXP"><meta property="og:description" content="Professional mobile software and technical resources."><meta property="og:type" content="website"></head>
<body>
<div class="grid-bg"></div>
<div id="site-header"></div>

<section class="page-hero">
  <div class="container">
    <span class="eyebrow">MOBILE DATABASE</span>
    <h1>Search the <span class="hl">full device database</span></h1>
    <p>Look up any brand, model, or model number. Search matches partial text, is case-insensitive, and updates as you type.</p>
    <div class="search-bar">
      <input id="search-input" type="text" placeholder="Try: Samsung, Galaxy S24, iPhone 15, POCO X6...">
      <button id="search-btn">Search</button>
    </div>
    <div class="result-count" id="result-count"></div>
  </div>
</section>

<section>
  <div class="container">
    <div class="filter-row" id="brand-filter"></div>
    <div class="model-grid" id="model-grid"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="../js/icons.js"></script>
<script src="../js/app.js"></script>
<script src="../js/database.js"></script>
<script>
renderHeader("home");
renderFooter();

let activeBrand = "All";

async function init(){
  await loadModelsDB();
  const brandNames = ["All", ...new Set(MODELS_DB.map(m=>m.brand))].sort((a,b)=> a==="All"?-1:a.localeCompare(b));
  document.getElementById("brand-filter").innerHTML = brandNames.map(b=>
    `<div class="chip ${b==='All'?'active':''}" data-brand="${b}">${b}</div>`
  ).join("");
  document.querySelectorAll(".chip").forEach(chip=>{
    chip.addEventListener("click", ()=>{
      document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
      chip.classList.add("active");
      activeBrand = chip.dataset.brand;
      runSearch();
    });
  });

  wireSearch({
    inputId:"search-input", btnId:"search-btn", gridId:"model-grid", countId:"result-count",
    filterBase: m => activeBrand==="All" || m.brand===activeBrand
  });
}
function runSearch(){
  const input = document.getElementById("search-input");
  input.dispatchEvent(new Event("input"));
}
init();
</script>
</body>
</html>
