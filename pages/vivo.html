<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vivo Solutions | TechFix Software EXP</title>
<meta name="description" content="Vivo firmware, FRP and reset resources.">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/style.css">
<meta property="og:title" content="TechFix Software EXP"><meta property="og:description" content="Professional mobile software and technical resources."><meta property="og:type" content="website"></head>
<body>
<div class="grid-bg"></div>
<div id="site-header"></div>

<section class="page-hero" style="background:radial-gradient(700px 300px at 15% 0%, rgba(45,108,223,0.16), transparent 60%);">
  <div class="container">
    <span class="eyebrow" style="color:#8fb4ff;">VIVO</span>
    <h1>Vivo <span class="hl">Solutions</span></h1>
    <p>Search Vivo models. FRP reset, Funtouch/OriginOS firmware and flash tool guidance for supported devices.</p>
    <div class="search-bar">
      <input id="search-input" type="text" placeholder="Search — V30, X100, Y17s...">
      <button id="search-btn">Search</button>
    </div>
    <div class="result-count" id="result-count"></div>
  </div>
</section>

<section>
  <div class="container">
    <div class="model-grid" id="model-grid"></div>
  </div>
</section>

<div id="site-footer"></div>
<script src="../js/icons.js"></script>
<script src="../js/app.js"></script>
<script src="../js/database.js"></script>
<script>
renderHeader("vivo");
renderFooter();
async function init(){
  await loadModelsDB();
  wireSearch({inputId:"search-input", btnId:"search-btn", gridId:"model-grid", countId:"result-count", filterBase: m => m.brand === "Vivo"});
}
init();
</script>
</body>
</html>
