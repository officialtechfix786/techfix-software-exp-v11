<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oppo Solutions | TechFix Software EXP</title>
<meta name="description" content="OPPO firmware, FRP and reset resources.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="grid-bg"></div>
<div id="site-header"></div>

<section class="page-hero" style="background:radial-gradient(700px 300px at 15% 0%, rgba(26,158,92,0.16), transparent 60%);">
  <div class="container">
    <span class="eyebrow" style="color:#6ee7a8;">OPPO</span>
    <h1>OPPO <span class="hl">Solutions</span></h1>
    <p>Search OPPO models. FRP reset, ColorOS firmware and flash tool guidance for supported devices.</p>
    <div class="search-bar">
      <input id="search-input" type="text" placeholder="Search — Reno 11, Find X7, A78...">
      <button id="search-btn">Search</button>
    </div>
    <div class="result-count" id="result-count"></div>
  </div>
</section>

<section>
  <div class="container">
    <div class="model-grid" id="model-grid"></div>
  </div>
</section>

<div id="site-footer"></div>
<script src="js/icons.js"></script>
<script src="js/app.js"></script>
<script src="js/database.js"></script>
<script>
renderHeader("oppo");
renderFooter();
async function init(){
  await loadModelsDB();
  wireSearch({inputId:"search-input", btnId:"search-btn", gridId:"model-grid", countId:"result-count", filterBase: m => m.brand === "OPPO"});
}
init();
</script>
</body>
</html>
