<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Model Details | TechFix Software EXP</title><meta name="description" content="Mobile model technical reference and service information."><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/style.css"><meta property="og:title" content="TechFix Software EXP"><meta property="og:description" content="Professional mobile software and technical resources."><meta property="og:type" content="website"></head><body><div class="grid-bg"></div><div id="site-header"></div><main><section class="page-hero"><div class="container"><span class="eyebrow">MODEL DETAILS</span><div id="model-detail"></div></div></section></main><div id="site-footer"></div><script src="js/icons.js"></script><script src="js/app.js"></script><script src="js/database.js"></script><script>renderHeader("mobiles");renderFooter();loadModelsDB().then(()=>{const id=new URLSearchParams(location.search).get("id");const m=MODELS_DB.find(x=>x.id===id);const el=document.getElementById("model-detail");if(!m){el.innerHTML='<h1>Model <span class="hl">not found</span></h1><p>Return to the mobile database and search again.</p><a class="btn btn-primary" href="mobiles.html">Back to Mobiles</a>';return;}el.innerHTML=`<h1>${escapeHtml(m.brand)} <span class="hl">${escapeHtml(m.model)}</span></h1><p>${escapeHtml(m.description)}</p><div class="model-grid"><div class="res-card"><div class="r-cat">DEVICE</div><h5>Core Information</h5><p>Model number: ${escapeHtml(m.modelNumber||"N/A")}<br>Release: ${escapeHtml(m.releaseYear||"N/A")}<br>OS: ${escapeHtml(m.operatingSystem)}<br>Chipset: ${escapeHtml(m.chipset||"N/A")}<br>Boot: ${escapeHtml(m.bootType||"N/A")}</p></div><div class="res-card"><div class="r-cat">SERVICE</div><h5>Technical Resources</h5><p>Firmware: ${escapeHtml(m.firmware)}<br>Flash: ${escapeHtml(m.flash)}<br>Drivers: ${escapeHtml(m.drivers)}<br>Ne
