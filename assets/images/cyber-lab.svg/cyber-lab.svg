<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
<title id="title">Technician installing software on a laptop</title>
<desc id="desc">A colorful vector illustration of a technician at a laptop with software and official driver installation progress on screen in a cyber-themed workspace.</desc>
<defs>
 <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101933"/><stop offset=".5" stop-color="#17214a"/><stop offset="1" stop-color="#10152d"/></linearGradient>
