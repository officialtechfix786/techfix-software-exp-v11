<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Downloads & Resources | TechFix Software EXP</title>
<meta name="description" content="Firmware, drivers, flash tools, ADB & Fastboot and other official mobile software resources.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<meta property="og:title" content="TechFix Software EXP"><meta property="og:description" content="Professional mobile software and technical resources."><meta property="og:type" content="website"></head>
<body>
<div class="grid-bg"></div>
<div id="site-header"></div>

<section class="page-hero">
  <div class="container">
    <span class="eyebrow">DOWNLOADS</span>
    <h1>Firmware, Drivers & <span class="hl">Software Tools</span></h1>
    <p>Curated resources across firmware, flash tools, USB drivers and diagnostics. We link to official sources wherever possible — we never invent or host fake download links.</p>
  </div>
</section>

<section>
  <div class="container">
    <div class="filter-row" id="cat-filter"></div>
    <div class="res-grid" id="res-grid"></div>
  </div>
</section>

<div id="site-footer"></div>
<script src="js/icons.js"></script>
<script src="js/app.js"></script>
<script>
renderHeader("downloads");
renderFooter();

let RES = [];
let activeCat = "All";

function renderResources(){
  const grid = document.getElementById("res-grid");
  const list = activeCat==="All" ? RES : RES.filter(r=>r.category===activeCat);
  grid.innerHTML = list.map(r=>`
    <div class="res-card">
      <div class="r-cat">${r.category.toUpperCase()}</div>
      <h5>${r.name}</h5>
      <p>${r.description}</p>
      <div class="r-foot">
        <span class="r-src">${r.source}</span>
        <a class="r-cta" href="${r.url}" target="_blank" rel="noopener">Visit →</a>
      </div>
    </div>`).join("");
}

fetch("data/downloads.json").then(r=>r.json()).then(data=>{
  RES = data;
  const cats = ["All", ...new Set(RES.map(r=>r.category))];
  document.getElementById("cat-filter").innerHTML = cats.map(c=>`<div class="chip ${c==='All'?'active':''}" data-cat="${c}">${c}</div>`).join("");
  document.querySelectorAll(".chip").forEach(chip=>{
    chip.addEventListener("click", ()=>{
      document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
      chip.classList.add("active");
      activeCat = chip.dataset.cat;
      renderResources();
    });
  });
  renderResources();
}).catch(()=>{
  document.getElementById("res-grid").innerHTML = `<div class="no-results">Resource list is currently unavailable. Please try again later.</div>`;
});
</script>
</body>
</html>
